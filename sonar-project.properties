sonar.projectKey=marcelorodrigo_freshguard
sonar.organization=marcelorodrigo

# The rewrite tree. The Laravel tree is frozen and leaves in step 10; until
# then the PHP workflow only analyses master.
sonar.sources=cmd,internal,web/src
sonar.exclusions=internal/web/dist/**,web/node_modules/**,**/*_test.go,**/*.test.ts

sonar.tests=cmd,internal,web/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts

sonar.typescript.tsconfigPaths=web/tsconfig.json
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.coverage.exclusions=web/src/main.ts,web/src/env.d.ts
